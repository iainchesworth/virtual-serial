name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly, so new queries catch existing code even without a push.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    # Code scanning on a private repository requires GitHub Advanced Security;
    # it is free for public repositories.  Skip cleanly when it is unavailable
    # instead of failing the CI run.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Boost outside the workspace
        # CodeQL archives the files under the workspace; keeping Boost in the
        # runner temp directory keeps third-party headers out of the database.
        run: |
          python tools/fetch_boost.py --version 1.92.0 \
            --dest "$RUNNER_TEMP/boost-root"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure
        run: |
          cmake -S . -B build-codeql \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_ROOT="$RUNNER_TEMP/boost-root"

      - name: Build
        run: cmake --build build-codeql --parallel 4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
